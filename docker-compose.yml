version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: control_tower_postgres
    environment:
      POSTGRES_USER: controltower
      POSTGRES_PASSWORD: controltower
      POSTGRES_DB: controltower_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controltower -d controltower_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: control_tower_redis
    ports:
      - "6379:6379"

  persist-database:
    build: ./services/persist_database
    container_name: persist_database_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: controltower_db
      POSTGRES_USER: controltower
      POSTGRES_PASSWORD: controltower
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./services/persist_database/sql:/app/sql
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.gethostbyname('postgres')"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-ingestion-service:
    build: ./services/data_ingestion
    container_name: data_ingestion_service
    depends_on:
      persist-database:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: controltower_db
      POSTGRES_USER: controltower
      POSTGRES_PASSWORD: controltower
      REDIS_HOST: redis
      REDIS_PORT: 6379

  route-planner-service:
    build: ./services/route_planner
    container_name: route_planner_service
    depends_on:
      redis:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: always
  
  api-gateway:
    build: ./services/api_gateway
    container_name: api_gateway
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: controltower_db
      POSTGRES_USER: controltower
      POSTGRES_PASSWORD: controltower
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
  
volumes:
  pg_data:
